<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Map Debug Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; padding:0; }
#map { position:absolute; top:0; bottom:0; width:100%; }

/* (ALL YOUR STYLES KEPT EXACTLY SAME) */

#debugPanel {
 position:absolute;
 bottom:10px;
 left:10px;
 width:360px;
 max-height:220px;
 overflow:auto;
 background:rgba(0,0,0,0.75);
 color:#00ff9d;
 font-family:monospace;
 font-size:11px;
 padding:10px;
 border-radius:8px;
 z-index:99999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="debugPanel"></div>
<div id="sidePanel"></div>

<script>
const API_BASE = "https://zjt4sxvh0l.execute-api.eu-north-1.amazonaws.com";

let map;
let users = [];
let events = [];
let hasRendered = false;

let markers = [];
let eventMarkers = [];
let selectedMarker = null;

function logDebug(msg, data) {
 const box = document.getElementById("debugPanel");
 const time = new Date().toLocaleTimeString();

 const line = document.createElement("div");
 line.textContent = `[${time}] ${msg} ${data ? JSON.stringify(data).slice(0,200) : ""}`;

 box.appendChild(line);
 box.scrollTop = box.scrollHeight;

 console.log(msg, data);
}

init();

function init() {

 logDebug("Init map");

 map = L.map('map').setView([59.3293, 18.0686], 10);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
   attribution: '&copy; OpenStreetMap'
 }).addTo(map);

 loadData();
}

async function loadData() {

 try {

   logDebug("Fetching users + events");

   const [u, e] = await Promise.all([
     fetchUsers(),
     fetchEvents()
   ]);

   users = u;
   events = e;

   logDebug("Users loaded", users.length);
   logDebug("Events loaded", events.length);

   if (!hasRendered) {
     hasRendered = true;
     render();
   }

 } catch (err) {
   logDebug("LOAD ERROR", err.message);
 }
}

async function fetchUsers() {
 const res = await fetch(`${API_BASE}/users`);
 const json = await res.json();

 logDebug("Users API raw", json?.length);

 return json || [];
}

/* ✅ FIXED EVENT FETCH */
async function fetchEvents() {
 const res = await fetch(`${API_BASE}/posts`);
 const json = await res.json();

 logDebug("Posts raw", json?.length);

 const filtered = (json || []).filter(p =>
   (p.category?.S || p.category) === "Event"
 );

 logDebug("Filtered events", filtered.length);

 return filtered;
}

/* USERS MARKERS */
function renderUsers() {

 users.forEach(u => {

   const marker = L.marker([u.latitude, u.longitude]).addTo(map);

   marker.userData = u;

   markers.push(marker);
 });
}

/* 🔥 EVENTS MARKERS (THIS WAS MISSING) */
function renderEvents() {

 events.forEach(e => {

   const lat = parseFloat(e.latitude?.S || e.latitude);
   const lng = parseFloat(e.longitude?.S || e.longitude);

   if (!lat || !lng) return;

   const icon = L.divIcon({
     className: "",
     html: `<div style="
       width:14px;height:14px;
       background:red;
       border-radius:50%;
       border:2px solid white;
       box-shadow:0 0 6px rgba(255,0,0,0.6);
     "></div>`,
     iconSize: [14,14],
     iconAnchor: [7,7]
   });

   const marker = L.marker([lat, lng], { icon }).addTo(map);

   eventMarkers.push(marker);
 });
}

/* MASTER RENDER */
function render() {

 logDebug("Rendering markers");

 renderUsers();
 renderEvents();

 logDebug("Markers created", markers.length);
 logDebug("Event markers created", eventMarkers.length);
}
</script>

</body>
</html>
