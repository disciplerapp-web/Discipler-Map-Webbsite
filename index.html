  display:none;
  position:fixed;
  bottom:0;

  right:0;
  max-height:40vh;
  overflow:auto;
  background:#111;
  color:#0f0;

  font-size:12px;
  padding:12px;
  z-index:99999;
  white-space:pre-wrap;
  word-break:break-all;
"></div>

<div class="disciplerTemporaryNav">

  <button onclick="showWelcomePage()">
    ✝ EXPLORE DISCIPLER
  </button>

  <button onclick="showSharedAudioDemo()">
    🎧 Shared Audio
  </button>

  </button>

    🗺️ Back to Map
  </button>

<script>
const API_BASE = "https://zjt4sxvh0l.execute-api.eu-north-1.amazonaws.com";

function debugLog(label, value) {
  const panel = document.getElementById("debugPanel");
  if (!panel) return;
  panel.style.display = "block";
  const line = document.createElement("div");
  line.style.marginBottom = "8px";
  line.style.borderBottom = "1px solid #333";
  line.style.paddingBottom = "8px";
  line.textContent = `${label}: ${typeof value === "string" ? value : JSON.stringify(value)}`;
  panel.appendChild(line);
}

// 🔥 ADDED — configure Amplify for anonymous (public IAM) access to AppSync
const { Amplify, API, graphqlOperation } = aws_amplify;

Amplify.configure({
  Auth: {
    region: "eu-north-1",                         // ⚠️ confirm this matches your Cognito region
    identityPoolId: "eu-north-1:a92c2232-e559-4e70-a12c-ea1543de3b1d",  // ⚠️ from amplifyconfiguration.json
    mandatorySignIn: false
  },
  API: {
    graphql_endpoint: "https://j477ltgkvvhgbazn6ivbfb5be4.appsync-api.eu-north-1.amazonaws.com/graphql", // ⚠️ from amplifyconfiguration.json
    graphql_endpoint_iam_region: "eu-north-1",
    aws_appsync_authenticationType: "AWS_IAM"
  }
});

// 🔥 ADDED — the auto-generated Amplify query for fetching one HomeItem by id
const getHomeItemQuery = `
  query GetHomeItem($id: ID!) {
    getHomeItem(id: $id) {
      id
      homeSectionID
      threadTitle
      threadSubtitle
      username
      owner
    }
  }
`;

let map;
let users = [];
let events = [];
let posts = [];

let markers = [];
let selectedMarker = null;

init();

function init() {

 map = L.map('map').setView([59.3293, 18.0686], 10);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
   attribution: '&copy; OpenStreetMap'
 }).addTo(map);

 loadData();
 setupSearch();

 map.on("click", hideSidePanel);
}

async function loadData() {

 const [u, e, p] = await Promise.all([
   fetchUsers(),
   fetchEvents(),
   fetchPosts()
 ]);

 users = u;
 events = e;
 posts = p;

 console.log("Fresh users:", users);
 console.log("Fresh posts:", posts);

 render();
}

async function fetchUsers() {

 const res = await fetch(
   `${API_BASE}/users?t=${Date.now()}`,
   { cache: "no-store" }
 );

 const json = await res.json();

 console.log("Users returned from API:", json);

 return (json || []).map(normalizeUser);
}

async function fetchEvents() {
 return [];
}

// 🔥 ADDED
async function fetchPosts() {

 const res = await fetch(
   `${API_BASE}/posts?t=${Date.now()}`,
   { cache: "no-store" }
 );

 const json = await res.json();

 console.log("Posts returned from API:", json);

 return (json || [])
   .filter(p =>
     (p.category?.S || p.category || "").toLowerCase() === "event"
   )
   .map(p => {

     let loc = p.location?.S || p.location || "";
     let lat = 0, lng = 0;

     if (loc.includes(",")) {
       const parts = loc.split(",");
       lat = parseFloat(parts[0]);
       lng = parseFloat(parts[1]);
     }

     return {
       ...p,
       latitude: lat,
       longitude: lng
     };
   });
}

async function fetchThreadById(threadId) {

  debugLog("1. threadId received", threadId || "(none)");

  if (!threadId) {
    debugLog("2. Skipped fetch", "no threadId was passed in");
    return null;
  }

  try {
    debugLog("2. Calling AppSync", "getHomeItem query");

    const result = await API.graphql(
      graphqlOperation(getHomeItemQuery, { id: threadId })
    );

    debugLog("3. GraphQL result", result);

    const item = result?.data?.getHomeItem;

    if (!item) {
      debugLog("4. Result", "No matching HomeItem found");
      return null;
    }

    debugLog("4. Found HomeItem", item);
    return item;

  } catch (err) {
    debugLog("ERROR", JSON.stringify(err));
    return null;
  }
}


 
function normalizeUser(u) {

 const loc = u.location?.M || u.location;

 const latRaw = loc?.latitude?.N ?? loc?.latitude;
 const lngRaw = loc?.longitude?.N ?? loc?.longitude;
 const imageKey = u.imageKey?.S || u.imageKey;

 const socialRaw = u.socialMediaLinks?.L || u.socialMediaLinks || [];
 const socialMediaLinks = socialRaw.map(item => {
   const val = item.M || item;
   return {
     platform: val.platform?.S || val.platform,
     url: val.url?.S || val.url
   };
 });

 return {
   ...u,
   name: u.name?.S || u.name,
   email: u.email?.S || u.email,
   username: u.username?.S || u.username,
   church: u.church?.S || u.church,
   churchPosition: u.churchPosition?.S || u.churchPosition,
   bio: u.bio?.S || u.bio,
   socialMediaLinks,
   recommended: u.recommended?.S || u.recommended,
   profileImage: imageKey
     ? `https://discipler221e46f-prod.s3.eu-north-1.amazonaws.com/public/profilePics/${imageKey}/profile.jpg`
     : null,
   ghostMode: u.ghostMode?.BOOL === true,
   latitude: parseFloat(latRaw),
   longitude: parseFloat(lngRaw)
 };
}

function createIcon(u) {

 const isRecommended = !!u.recommended;
 const isChurchLeader = (u.churchPosition || "").toLowerCase() === "church leader";
 const hasProfileImage = !!u.profileImage;

 // OUTER RING
 const outerRing = isRecommended ? "#2eea6b" : "white";

 // CHURCH LEADER WITH PROFILE IMAGE
 if (isChurchLeader && hasProfileImage) {

   return L.divIcon({
     className: "",
     html: `
       <div class="marker-inner" style="
         width:34px;
         height:34px;
         border-radius:50%;
         background:${outerRing};
         display:flex;
         align-items:center;
         justify-content:center;
         box-shadow:0 2px 6px rgba(0,0,0,0.3);
       ">
         <img src="${u.profileImage}" style="
           width:28px;
           height:28px;
           border-radius:50%;
           object-fit:cover;
         "/>
       </div>
     `,
     iconSize: [34, 34],
     iconAnchor: [17, 17]
   });
 }

 // CHURCH LEADER WITHOUT PROFILE IMAGE
// CHURCH LEADER WITHOUT PROFILE IMAGE
if (isChurchLeader && !hasProfileImage) {

  return L.divIcon({
    className: "",
    html: `
      <div class="marker-inner" style="
        width:34px;
        height:34px;
        border-radius:50%;
        background:${outerRing};
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 2px 6px rgba(0,0,0,0.3);
      ">
        <div style="
          width:28px;
          height:28px;
          border-radius:50%;
          background:white;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:15px;
        ">
          🏛️
        </div>
      </div>
    `,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
 }

 // NORMAL USER
// NORMAL USER
const isRecommendedUser = isRecommended && !isChurchLeader;

return L.divIcon({
  className: "",
  html: `
    <div class="marker-inner" style="
      width:30px;
      height:30px;
      border-radius:50%;
      background:${isRecommendedUser ? '#2eea6b' : '#4a6cf7'};
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:14px;
      border:2px solid ${isRecommendedUser ? '#2eea6b' : 'white'};
      box-shadow:0 2px 6px rgba(0,0,0,0.3);
    ">
      👤
    </div>
  `,
  iconSize: [30, 30],
  iconAnchor: [15, 15]
});
}
// 🔥 ADDED
function createEventIcon() {
 return L.divIcon({
   className: "",
   html: `
     <div class="marker-inner event-marker" style="
       font-size:22px;
       display:flex;
       align-items:center;

       🔥

   `,

 });
}
 
function render() {

 console.log(
   "Rendering",
   users.length,
   "users and",
   posts.length,
   "posts"
 );

 map.eachLayer(layer => {
   if (layer instanceof L.Marker) map.removeLayer(layer);
 });

 markers = [];

users
  .filter(u =>
    !u.ghostMode &&
    u.latitude &&
    u.longitude &&
    !isNaN(u.latitude) &&
    !isNaN(u.longitude) &&

    // HIDE USERS WITH 0,0 COORDINATES
    !(
      u.latitude === 0 &&
      u.longitude === 0
    )
  )
  .forEach(u => {

  // Create marker first with default logic
  const marker = L.marker([u.latitude, u.longitude], {
    icon: createIcon({
      ...u,
      profileImage: null // assume no image first
    })
  }).addTo(map);

  // Check if image actually exists in S3
  if (u.profileImage) {

    const testImg = new Image();

    testImg.onload = () => {

      // Image exists -> switch marker to image version
      marker.setIcon(createIcon(u));
    };

    testImg.onerror = () => {

      // Image missing -> keep church icon
      marker.setIcon(createIcon({
        ...u,
        profileImage: null
      }));
    };

    testImg.src = u.profileImage;
  }

  marker.userData = u;

  marker.on("click", () => {
    selectMarker(marker);
    showSidePanel(u);
  });

  markers.push(marker);
});

 // 🔥 ADDED: POSTS / EVENTS ON MAP
 posts.forEach(p => {

   if (!p.latitude || !p.longitude) return;

   const marker = L.marker([p.latitude, p.longitude], {
     icon: createEventIcon()
   }).addTo(map);

const eventPhotoKey = p.photo?.S || p.photo || null;

const eventPhotoUrl = eventPhotoKey
  ? `https://discipler221e46f-prod.s3.eu-north-1.amazonaws.com/public/${eventPhotoKey}`
  : null;

marker.userData = {
  name: p.title || "Event",
  username: "event",
  bio: p.description || "",
  email: "",
  profileImage: eventPhotoUrl,
  photo: eventPhotoUrl
};

   marker.on("click", () => {
     selectMarker(marker);
     showSidePanel(marker.userData);
   });

   markers.push(marker);
 });
}

/* ✅ PULSING WORKS AGAIN */
function selectMarker(marker) {

 if (selectedMarker) {

   const prev = selectedMarker.getElement()?.querySelector(".marker-inner");

   if (prev) {
     prev.classList.remove("pulse");
     prev.style.animation = "";
   }
 }

 selectedMarker = marker;

 const el = marker.getElement()?.querySelector(".marker-inner");

 if (el && marker.userData?.username !== "event") {

   el.classList.add("pulse");

   if (marker.userData?.recommended) {
     el.style.animation = "pulseAnimGreen 1.2s infinite";
   } else {
     el.style.animation = "pulseAnim 1.2s infinite";
   }
 }

 map.setView(marker.getLatLng(), map.getZoom());
}

function setupSearch() {

 const input = document.getElementById("searchInput");
 const clearBtn = document.getElementById("clearSearch");

 input.addEventListener("input", () => {

   const val = input.value.toLowerCase();

   const results = users.filter(u =>
     (u.name || "").toLowerCase().includes(val) ||
     (u.username || "").toLowerCase().includes(val) ||
     (u.church || "").toLowerCase().includes(val)
   );

   renderSearch(results);
 });

 clearBtn.onclick = () => {
   input.value = "";
   document.getElementById("searchResults").innerHTML = "";
 };
}

function renderSearch(list) {

 const box = document.getElementById("searchResults");
 box.innerHTML = "";

 list.slice(0, 20).forEach(u => {

   const div = document.createElement("div");
   div.className = "search-item";

   div.innerHTML = `
     <div class="search-icon">👤</div>
     <div>
       <div><b>${u.name || u.username}</b></div>
       <div style="font-size:11px;color:gray;">${u.church || ""}</div>
     </div>
   `;

   div.onclick = () => {
     const m = markers.find(m => m.userData.username === u.username);
     if (m) {
       selectMarker(m);
       showSidePanel(u);
     }
   };

   box.appendChild(div);
 });
}

/* =========================================================
   BASIC HTML SAFETY
   ========================================================= */

function escapeHTML(value) {

 if (value === null || value === undefined) {
   return "";
 }

 return String(value)
   .replace(/&/g, "&amp;")
   .replace(/</g, "&lt;")
   .replace(/>/g, "&gt;")
   .replace(/"/g, "&quot;")
   .replace(/'/g, "&#039;");
}


/* =========================================================

   ========================================================= */

async function handleDisciplerURL() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page");
  const type = params.get("type");
  const code = params.get("code");   // the imprint, e.g. the HomeItem id

  if (page === "welcome") { showWelcomePage(); return; }
  if (page === "shared" && type === "audio") { showSharedAudioDemo(code); return; }
  if (page === "shared" && type === "thread") { await showSharedThreadDemo(code); return; }
}

async function showSharedThreadDemo(code) {

  console.log("Thread code from SMS link:", code);

  const data = await fetchThreadById(code);

  if (!data) {
    const fallbackThread = {
      title: "Thread not found",
      author: "Discipler",
      message: "This shared thread could not be loaded. It may have been removed."
    };
    showSharedThread(fallbackThread);
    return;
  }

  const sharedThread = {
    title: data.threadTitle || "Shared Thread",
    author: data.username || "Discipler",
    message: data.threadSubtitle || ""
  };

  showSharedThread(sharedThread);
}
