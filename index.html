<!DOCTYPE html>

<style>
body { margin:0; padding:0; }

/* SEARCH UI */
#searchContainer {

#searchInput {

}

#clearSearch {

 justify-content:center;

/* SEARCH RESULTS */

.search-item {

}

/* PULSE BACK (was missing) */
.pulse {
 animation: pulseAnim 1.2s infinite;
}

@keyframes pulseAnim {
 0% { transform: scale(1); box-shadow:0 0 0 0 rgba(74,108,247,0.6); }
 70% { transform: scale(1.3); box-shadow:0 0 0 15px rgba(74,108,247,0); }
 100% { transform: scale(1); box-shadow:0 0 0 0 rgba(74,108,247,0); }
}
@keyframes pulseAnimGreen {
 0% { transform: scale(1); box-shadow:0 0 0 0 rgba(46,234,107,0.6); }
 70% { transform: scale(1.3); box-shadow:0 0 0 15px rgba(46,234,107,0); }
 100% { transform: scale(1); box-shadow:0 0 0 0 rgba(46,234,107,0); }
}
 
/* SIDE PANEL */
#sidePanel {
 position:absolute;
 top:0;
 left:0;
 height:100%;
 width:16.6vw;
 min-width:260px;
 max-width:340px;
 background:white;
 z-index:10001; /* ✅ ABOVE SEARCH */
 transform:translateX(-110%);

}

#sidePanel.active {

}

.sideProfileImg {

 margin-top:10px;
}

.sideName {

}

}

.sideButtons {

}

.sideBtn {

.emailIcon svg {

/* SOCIAL ICONS */

.socialIcon {

/* APP PREVIEW */

.appPreviewRow img {

/* TEXT */
.downloadText {

/* =========================================================

.disciplerPeopleRow {

<body>

<div id="map"></div>

<div id="searchContainer">
  <input id="searchInput" placeholder="Search users..." />
  <div id="clearSearch">✕</div>
  <div id="searchResults"></div>
</div>

<div id="sidePanel"></div>

<script>
const API_BASE = "https://zjt4sxvh0l.execute-api.eu-north-1.amazonaws.com";

let map;
let users = [];
let events = [];
let posts = [];

let markers = [];
let selectedMarker = null;

init();

function init() {

 map = L.map('map').setView([59.3293, 18.0686], 10);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
   attribution: '&copy; OpenStreetMap'
 }).addTo(map);

 loadData();
 setupSearch();

 map.on("click", hideSidePanel);
}

async function loadData() {

 const [u, e, p] = await Promise.all([
   fetchUsers(),
   fetchEvents(),
   fetchPosts()
 ]);

 users = u;
 events = e;
 posts = p;

 console.log("Fresh users:", users);
 console.log("Fresh posts:", posts);

 render();
}

async function fetchUsers() {

 const res = await fetch(
   `${API_BASE}/users?t=${Date.now()}`,
   { cache: "no-store" }
 );

 const json = await res.json();

 console.log("Users returned from API:", json);

 return (json || []).map(normalizeUser);
}

async function fetchEvents() {
 return [];
}

// 🔥 ADDED
async function fetchPosts() {

 const res = await fetch(
   `${API_BASE}/posts?t=${Date.now()}`,
   { cache: "no-store" }
 );

 const json = await res.json();

 console.log("Posts returned from API:", json);

 return (json || [])
   .filter(p =>
     (p.category?.S || p.category || "").toLowerCase() === "event"
   )
   .map(p => {

     let loc = p.location?.S || p.location || "";
     let lat = 0, lng = 0;

     if (loc.includes(",")) {
       const parts = loc.split(",");
       lat = parseFloat(parts[0]);
       lng = parseFloat(parts[1]);
     }

     return {
       ...p,
       latitude: lat,
       longitude: lng
     };
   });
}
 
function normalizeUser(u) {

 const loc = u.location?.M || u.location;

 const latRaw = loc?.latitude?.N ?? loc?.latitude;
 const lngRaw = loc?.longitude?.N ?? loc?.longitude;
 const imageKey = u.imageKey?.S || u.imageKey;

 const socialRaw = u.socialMediaLinks?.L || u.socialMediaLinks || [];
 const socialMediaLinks = socialRaw.map(item => {
   const val = item.M || item;
   return {
     platform: val.platform?.S || val.platform,
     url: val.url?.S || val.url
   };
 });

 return {
   ...u,
   name: u.name?.S || u.name,
   email: u.email?.S || u.email,
   username: u.username?.S || u.username,
   church: u.church?.S || u.church,
   churchPosition: u.churchPosition?.S || u.churchPosition,
   bio: u.bio?.S || u.bio,
   socialMediaLinks,
   recommended: u.recommended?.S || u.recommended,
   profileImage: imageKey
     ? `https://discipler221e46f-prod.s3.eu-north-1.amazonaws.com/public/profilePics/${imageKey}/profile.jpg`
     : null,
   ghostMode: u.ghostMode?.BOOL === true,
   latitude: parseFloat(latRaw),
   longitude: parseFloat(lngRaw)
 };
}

function createIcon(u) {

 const isRecommended = !!u.recommended;
 const isChurchLeader = (u.churchPosition || "").toLowerCase() === "church leader";
 const hasProfileImage = !!u.profileImage;

 // OUTER RING
 const outerRing = isRecommended ? "#2eea6b" : "white";

 // CHURCH LEADER WITH PROFILE IMAGE
 if (isChurchLeader && hasProfileImage) {

   return L.divIcon({
     className: "",
     html: `
       <div class="marker-inner" style="
         width:34px;
         height:34px;
         border-radius:50%;
         background:${outerRing};
         display:flex;
         align-items:center;
         justify-content:center;
         box-shadow:0 2px 6px rgba(0,0,0,0.3);
       ">
         <img src="${u.profileImage}" style="
           width:28px;
           height:28px;
           border-radius:50%;
           object-fit:cover;
         "/>
       </div>
     `,
     iconSize: [34, 34],
     iconAnchor: [17, 17]
   });
 }

 // CHURCH LEADER WITHOUT PROFILE IMAGE
// CHURCH LEADER WITHOUT PROFILE IMAGE
if (isChurchLeader && !hasProfileImage) {

  return L.divIcon({
    className: "",
    html: `
      <div class="marker-inner" style="
        width:34px;
        height:34px;
        border-radius:50%;
        background:${outerRing};
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 2px 6px rgba(0,0,0,0.3);
      ">
        <div style="
          width:28px;
          height:28px;
          border-radius:50%;
          background:white;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:15px;
        ">
          🏛️
        </div>
      </div>
    `,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
 }

 // NORMAL USER
// NORMAL USER
const isRecommendedUser = isRecommended && !isChurchLeader;

return L.divIcon({
  className: "",
  html: `
    <div class="marker-inner" style="
      width:30px;
      height:30px;
      border-radius:50%;
      background:${isRecommendedUser ? '#2eea6b' : '#4a6cf7'};
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:14px;
      border:2px solid ${isRecommendedUser ? '#2eea6b' : 'white'};
      box-shadow:0 2px 6px rgba(0,0,0,0.3);
    ">
      👤
    </div>
  `,
  iconSize: [30, 30],
  iconAnchor: [15, 15]
});
}
// 🔥 ADDED
function createEventIcon() {
 return L.divIcon({
   className: "",
   html: `
     <div class="marker-inner event-marker" style="
       font-size:22px;
       display:flex;
       align-items:center;
       justify-content:center;
     ">
       🔥
     </div>
   `,
   iconSize: [36, 36],
   iconAnchor: [20, 20]
 });
}
 
function render() {

 console.log(
   "Rendering",
   users.length,
   "users and",
   posts.length,
   "posts"
 );

 map.eachLayer(layer => {
   if (layer instanceof L.Marker) map.removeLayer(layer);
 });

 markers = [];

users
  .filter(u =>
    !u.ghostMode &&
    u.latitude &&
    u.longitude &&
    !isNaN(u.latitude) &&
    !isNaN(u.longitude) &&

    // HIDE USERS WITH 0,0 COORDINATES
    !(
      u.latitude === 0 &&
      u.longitude === 0
    )
  )
  .forEach(u => {

  // Create marker first with default logic
  const marker = L.marker([u.latitude, u.longitude], {
    icon: createIcon({
      ...u,
      profileImage: null // assume no image first
    })
  }).addTo(map);

  // Check if image actually exists in S3
  if (u.profileImage) {

    const testImg = new Image();

    testImg.onload = () => {

      // Image exists -> switch marker to image version
      marker.setIcon(createIcon(u));
    };

    testImg.onerror = () => {

      // Image missing -> keep church icon
      marker.setIcon(createIcon({
        ...u,
        profileImage: null
      }));
    };

    testImg.src = u.profileImage;
  }

  marker.userData = u;

  marker.on("click", () => {
    selectMarker(marker);
    showSidePanel(u);
  });

  markers.push(marker);
});

 // 🔥 ADDED: POSTS / EVENTS ON MAP
 posts.forEach(p => {

   if (!p.latitude || !p.longitude) return;

   const marker = L.marker([p.latitude, p.longitude], {
     icon: createEventIcon()
   }).addTo(map);

const eventPhotoKey = p.photo?.S || p.photo || null;

const eventPhotoUrl = eventPhotoKey
  ? `https://discipler221e46f-prod.s3.eu-north-1.amazonaws.com/public/${eventPhotoKey}`
  : null;

marker.userData = {
  name: p.title || "Event",
  username: "event",
  bio: p.description || "",
  email: "",
  profileImage: eventPhotoUrl,
  photo: eventPhotoUrl
};

   marker.on("click", () => {
     selectMarker(marker);
     showSidePanel(marker.userData);
   });

   markers.push(marker);
 });
}

/* ✅ PULSING WORKS AGAIN */
function selectMarker(marker) {

 if (selectedMarker) {

   const prev = selectedMarker.getElement()?.querySelector(".marker-inner");

   if (prev) {
     prev.classList.remove("pulse");
     prev.style.animation = "";
   }
 }

 selectedMarker = marker;

 const el = marker.getElement()?.querySelector(".marker-inner");

 if (el && marker.userData?.username !== "event") {

   el.classList.add("pulse");

   if (marker.userData?.recommended) {
     el.style.animation = "pulseAnimGreen 1.2s infinite";
   } else {
     el.style.animation = "pulseAnim 1.2s infinite";
   }
 }

 map.setView(marker.getLatLng(), map.getZoom());
}

function showSidePanel(u) {

 const panel = document.getElementById("sidePanel");

 const socialHTML = (u.socialMediaLinks || []).map(s => {

   let img = "link.png";
   if (s.platform?.toLowerCase().includes("instagram")) img = "instagram.png";
   if (s.platform?.toLowerCase().includes("youtube")) img = "youtube.png";
   if (s.platform?.toLowerCase().includes("facebook")) img = "facebook.png";
   if (s.platform?.toLowerCase().includes("tiktok")) img = "tiktok.png";

   return `<a class="socialIcon" href="${s.url}" target="_blank">
     <img src="${img}" />
   </a>`;
 }).join("");

 panel.innerHTML = `
   <img class="sideProfileImg" src="${u.profileImage || u.photo || 'https://via.placeholder.com/100'}"/>

   <div class="sideName">${u.name || ""}</div>
   <div class="sideUsername">@${u.username || ""}</div>
   <div class="sideChurch">${u.church || ""}</div>
   <div class="sideBio">${u.bio || ""}</div>

   <div class="socialRow">${socialHTML}</div>

   <div class="sideButtons">

     <a class="sideBtn" href="mailto:${u.email || ''}">
       <span class="emailIcon">
         <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
           <path d="M4 4h16v16H4z"/>
           <path d="M22 6l-10 7L2 6"/>
         </svg>
       </span>
       Send email
     </a>

   </div>
   
   <a class="sideBtn" href="https://apps.apple.com/se/app/discipler/id6756657404" target="_blank">
     🍎 Download app on iOS
   </a>

   <a class="sideBtn" href="https://play.google.com/store/apps/details?id=com.theway.discipler44&hl=en" target="_blank">
     🤖 Download app on Android
   </a>

   <div class="appPreviewRow">
     <img src="app_preview_1.png" />
     <img src="app_preview_2.png" />
   </div>

   <div class="downloadText">
     Download the Discipler app on IOS or Android to add your marker to the map and get discipled in healing the sick, casting out demons, preaching the gospel, and living a life by the Holy Spirit.
   </div>
   
 `;

 panel.classList.add("active");
}

function hideSidePanel() {
 document.getElementById("sidePanel").classList.remove("active");
}

function setupSearch() {

 const input = document.getElementById("searchInput");
 const clearBtn = document.getElementById("clearSearch");

 input.addEventListener("input", () => {

   const val = input.value.toLowerCase();

   const results = users.filter(u =>
     (u.name || "").toLowerCase().includes(val) ||
     (u.username || "").toLowerCase().includes(val) ||
     (u.church || "").toLowerCase().includes(val)
   );

   renderSearch(results);
 });

 clearBtn.onclick = () => {
   input.value = "";
   document.getElementById("searchResults").innerHTML = "";
 };
}

function renderSearch(list) {

 const box = document.getElementById("searchResults");
 box.innerHTML = "";

 list.slice(0, 20).forEach(u => {

   const div = document.createElement("div");
   div.className = "search-item";

   div.innerHTML = `
     <div class="search-icon">👤</div>
     <div>
       <div><b>${u.name || u.username}</b></div>
       <div style="font-size:11px;color:gray;">${u.church || ""}</div>
     </div>
   `;

   div.onclick = () => {
     const m = markers.find(m => m.userData.username === u.username);
     if (m) {
       selectMarker(m);
       showSidePanel(u);
     }
   };

   box.appendChild(div);
 });
}
</script>

</body>
</html>
